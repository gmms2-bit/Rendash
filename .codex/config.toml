# Configuração do Codex neste projeto (vale quando o projeto é confiável). Espelha o `.mcp.json` do
# Claude Code: mudou um, mude o outro. Regras ficam no AGENTS.md; agentes em .codex/agents (gerados).

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@0.0.83", "--headless", "--isolated", "--output-dir", ".playwright-mcp"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@1.10.1", "--headless", "--isolated", "--viewport", "1440x900", "--usageStatistics=false"]
